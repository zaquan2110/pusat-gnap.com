<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pusat Komunitas - Official Template</title>
    <style>
        :root {
            --bg-dark: #020617;
            --sidebar-bg: #0f172a;
            --content-bg: #0b1329;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-red: #dc2626;
            --text-light: #f8fafc;
            --border-color: #334155;
            --text-muted: #64748b;
            --folder-bg: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; overflow: hidden; display: flex; }

        /* LAYAR KIRI: SIDEBAR */
        .sidebar {
            width: 310px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            height: 100%;
            flex-shrink: 0;
        }

        /* HEADER LOGO & INSTANSI */
        .community-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        .community-logo {
            width: 45px;
            height: 45px;
            background-color: #1e293b;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
        }
        .community-logo img { width: 100%; height: 100%; object-fit: cover; }
        .community-info h2 { font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase; color: #fff; line-height: 1.2; }
        .community-info p { font-size: 11px; color: #38bdf8; font-weight: 600; text-transform: uppercase; }

        /* KARTU KTP ANGGOTA */
        .ktp-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px dashed #60a5fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .ktp-title {
            font-size: 10px;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            margin-bottom: 8px;
            text-align: center;
        }
        .ktp-body { display: flex; gap: 10px; align-items: center; }
        .ktp-avatar {
            width: 50px;
            height: 50px;
            background-color: #334155;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            overflow: hidden;
        }
        .ktp-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .ktp-details { font-size: 11px; line-height: 1.4; color: #cbd5e1; }
        .ktp-details strong { color: #fff; font-size: 12px; }

        /* FITUR CARI TOMBOL */
        .search-container { margin-bottom: 12px; }
        .search-input {
            width: 100%;
            padding: 8px 12px;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--accent-blue); }

        /* DAFTAR MENU BUTTONS */
        .menu-scroll {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 2px;
        }
        .menu-scroll::-webkit-scrollbar { width: 4px; }
        .menu-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        
        .category-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #38bdf8; letter-spacing: 0.5px; margin: 12px 0 5px 2px; }
        .category-title:first-of-type { margin-top: 2px; }
        
        .menu-btn {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            color: #cbd5e1;
            padding: 9px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: all 0.2s ease;
        }
        .menu-btn:hover, .menu-btn.active {
            background-color: var(--accent-blue);
            color: #fff;
            border-color: #60a5fa;
            transform: translateX(3px);
        }
        .menu-btn.btn-admin-side { border-color: #ef4444; color: #f87171; }
        .menu-btn.btn-admin-side:hover { background-color: var(--accent-red); color: #fff; }

        .sidebar-footer { padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 10px; }

        /* LAYAR KANAN: ISI KONTEN UTAMA */
        .content-area {
            flex-grow: 1;
            background-color: var(--content-bg);
            padding: 30px;
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .content-card {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .content-card.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-card h1 { font-size: 20px; margin-bottom: 15px; border-left: 4px solid var(--accent-blue); padding-left: 10px; text-transform: uppercase; }
        .content-card p { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 15px; }
        
        /* FORMAT TABEL DATA */
        .table-roster { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table-roster th, .table-roster td { border: 1px solid var(--border-color); padding: 12px; text-align: left; font-size: 13px; }
        .table-roster th { background-color: #1e293b; color: #fff; }
        .table-roster td { background-color: #0f172a; }

        /* TAMPILAN FITUR FILE EXPLORER */
        .file-manager-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        .file-item {
            background-color: var(--folder-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .file-item:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .file-icon { font-size: 32px; margin-bottom: 8px; }
        .file-name { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .file-size { font-size: 10px; color: var(--text-muted); margin-bottom: 10px; }
        .file-actions { display: flex; gap: 5px; justify-content: center; }
        
        .btn-file-action { padding: 5px 10px; font-size: 11px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; text-decoration: none; color: #fff; }
        .btn-preview { background-color: var(--accent-blue); }
        .btn-preview:hover { background-color: var(--accent-hover); }

        /* WIDGET FRAME LAYAR PRATINJAU FILE */
        .preview-frame-container {
            margin-top: 20px;
            flex-grow: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #090d16;
            display: flex;
            flex-direction: column;
            min-height: 450px;
        }
        .frame-header {
            background-color: #1e293b;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .frame-body { flex-grow: 1; width: 100%; height: 100%; border: none; background-color: #fff; border-radius: 0 0 8px 8px; }

        /* POP-UP LOGIN ADMIN */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background-color: #1e293b; border: 1px solid #ef4444; padding: 25px; border-radius: 8px; width: 300px; text-align: center; }
        .login-box h3 { font-size: 16px; margin-bottom: 15px; color: #fff; }
        .login-box input { width: 100%; padding: 8px; margin-bottom: 12px; border-radius: 4px; border: 1px solid var(--border-color); background-color: #0f172a; color: #fff; text-align: center; }
        .login-box button { width: 100%; padding: 8px; background-color: var(--accent-blue); border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; margin-bottom: 8px; }
